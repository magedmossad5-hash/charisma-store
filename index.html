    <style>
        :root {
            --primary-color: #e91e63;
            --secondary-color: #8e24aa;
            --dark-color: #212121;
            --light-bg: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark-color);
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            padding: 20px 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .cart-icon-btn {
            position: relative;
            background: white;
            color: var(--primary-color);
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .cart-badge {
            background: #d32f2f;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 0.8rem;
        }

        .controls-section {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #ddd;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        .search-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .categories-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: thin;
        }

        .category-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 18px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .category-btn.active, .category-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .products-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 700;
            color: #333;
            line-height: 1.4;
        }

        .product-category {
            font-size: 0.8rem;
            color: #777;
            background: #eee;
            padding: 3px 8px;
            border-radius: 10px;
            width: fit-content;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-top: auto;
        }

        .add-to-cart-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .add-to-cart-btn:hover {
            background: #6a1b9a;
        }

        /* Cart Modal */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: flex-end;
            z-index: 2000;
        }

        .cart-content {
            background: white;
            width: 100%;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .close-cart {
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items-list {
            flex-grow: 1;
            overflow-y: auto;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .cart-item-title {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: #ddd;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .checkout-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

            {"id": "10205", "name": "مولفيكس مقاس ٣ (٦٤ حبة) ٣١٠ج", "category": "بامبرز", "price": 310.0},
            {"id": "10206", "name": "مولفيكس مقاس ٤ (٥٨ حبة) ٣٣٠ج", "category": "بامبرز", "price": 330.0}
        ];

        let cart = [];
        let currentCategory = 'الكل';

        // Initialize App
        window.onload = function() {
            renderCategories();
            renderProducts(allProducts);
        };

        function renderCategories() {
            const categoriesContainer = document.getElementById('categoriesContainer');
            const categories = ['الكل', ...new Set(allProducts.map(p => p.category))];
            
            categoriesContainer.innerHTML = categories.map(cat => `
                <button class="category-btn ${cat === currentCategory ? 'active' : ''}" 
                        onclick="setCategory('${cat}')">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            filterProducts();
        }

        function filterProducts() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allProducts.filter(p => {
                const matchesCat = currentCategory === 'الكل' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });
            renderProducts(filtered);
        }

        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            if(!items || items.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666; font-weight: bold;">لا توجد منتجات مطابقة للبحث</div>`;
                return;
            }
            grid.innerHTML = items.map(p => `
                <div class="product-card">
                    <div class="product-info">
                        <span class="product-category">${p.category}</span>
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price > 0 ? p.price + ' ج.م' : 'حسب الاختيار'}</div>
                    </div>
                    <button class="add-to-cart-btn" onclick="addToCart('${p.id}')">
                        <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
                    </button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = allProducts.find(p => p.id == productId);
            if (!product) return;

            const existing = cart.find(item => item.id == productId);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');

            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            cartCount.innerText = totalQty;
            cartTotal.innerText = totalPrice + ' ج.م';

            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <div class="cart-item-title">${item.name}</div>
                        <small>${item.price} ج.م</small>
                    </div>
                    <div class="quantity-controls">
                        <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, change) {
            const item = cart.find(i => i.id == id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id != id);
                }
            }
            updateCart();
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            let message = "مرحباً، أريد طلب المنتجات التالية من كاريزما:\n\n";
            cart.forEach(item => {
                message += `- ${item.name} (العدد: ${item.qty}) - السعر: ${item.price * item.qty} ج.م\n`;
            });

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            message += `\n*الإجمالي: ${total} ج.م*`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
