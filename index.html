<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر كاريزما</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #fff; padding: 15px; }
        
        /* الهيدر */
        header { margin-bottom: 20px; font-size: 24px; font-weight: 900; color: #e91e63; }
        
        /* البحث */
        .search-input { width: 100%; padding: 12px; border-radius: 20px; border: none; background: #1e1e1e; color: #fff; margin-bottom: 20px; outline: none; }
        
        /* الفئات (Scrollable) */
        .categories-container { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .categories-container::-webkit-scrollbar { display: none; }
        .cat-item { min-width: 90px; background: #1e1e1e; padding: 10px; border-radius: 12px; text-align: center; font-size: 14px; cursor: pointer; border: 1px solid #333; }
        .cat-item.active { border-color: #e91e63; color: #e91e63; }

        /* الكروت */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 10px; position: relative; }
        .img-box { width: 100%; height: 120px; background: #333; border-radius: 10px; margin-bottom: 10px; }
        .p-name { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .p-desc { font-size: 12px; color: #aaa; margin-bottom: 10px; }
        .p-price { font-weight: bold; color: #e91e63; margin-bottom: 10px; }
        .btn-add { width: 100%; padding: 8px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: #fff; }
        .btn-wish { width: 100%; padding: 8px; border-radius: 8px; border: none; background: #333; color: #fff; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header>كاريزما ✨</header>
    
    <input type="text" class="search-input" id="search" placeholder="ابحث عن منتجاتك..." onkeyup="filterProducts()">

    <div class="categories-container" id="cats">
        <div class="cat-item active" onclick="filterCat('الكل', this)">الكل</div>
        <div class="cat-item" onclick="filterCat('بشرة', this)">بشرة</div>
        <div class="cat-item" onclick="filterCat('شعر', this)">شعر</div>
    </div>

    <div class="product-grid" id="grid"></div>

    <script>
        const products = [
            { id: 1, name: "سيرم فيتامين سي", cat: "بشرة", desc: "سيرم يخليها أنضر ✨", price: "210 ج.م" },
            { id: 2, name: "سيرم الهيالورونيك", cat: "بشرة", desc: "ترطيب عميق 💧", price: "210 ج.م" },
            { id: 3, name: "شامبو علاجي", cat: "شعر", desc: "لمعان وقوة ✨", price: "180 ج.م" }
        ];

        function render(items) {
            const grid = document.getElementById('grid');
            grid.innerHTML = items.map(p => `
                <div class="card">
                    <div class="img-box"></div>
                    <div class="p-name">${p.name}</div>
                    <div class="p-desc">${p.desc}</div>
                    <div class="p-price">${p.price}</div>
                    <button class="btn-add" onclick="order('${p.name}')">أضف للسلة</button>
                    <button class="btn-wish">المفضلة</button>
                </div>
            `).join('');
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            const filtered = cat === 'الكل' ? products : products.filter(p => p.cat === cat);
            render(filtered);
        }

        function filterProducts() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = products.filter(p => p.name.includes(query));
            render(filtered);
        }

        function order(name) {
            window.open(`https://wa.me/201229044897?text=أريد طلب: ${name}`);
        }

        render(products);
    </script>
</body>
</html>
