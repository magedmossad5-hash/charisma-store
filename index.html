<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر كاريزما - Charisma Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 15px; }
        
        /* الهيدر */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: 900; color: #e91e63; }
        
        /* الشبكة */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background-color: #1e1e1e; border-radius: 15px; padding: 10px; }
        .img-box { width: 100%; height: 120px; background: #333; border-radius: 10px; margin-bottom: 10px; }
        
        /* النصوص */
        .p-name { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .p-desc { font-size: 12px; color: #aaa; margin-bottom: 10px; line-height: 1.4; }
        .p-price { color: #e91e63; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        
        /* الأزرار */
        .btn-action { width: 100%; padding: 8px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 14px; }
        .btn-add { background: white; color: black; }
        .btn-wish { background: #333; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo">كاريزما✨</div>
    </header>

    <div class="product-grid" id="grid">
        <!-- المنتجات -->
    </div>

    <script>
        const myPhoneNumber = "201229044897"; // ضعي رقمك هنا

        const products = [
            { name: "سيرم فيتامين سي", desc: "لو بشرتك باهتة... السيرم ده هيخليها أنضر بشكل ملحوظ ✨🍊", price: "210 ج.م" },
            { name: "سيرم الهيالورونيك", desc: "لو بشرتك جافة أو محتاجة ترطيب... السيرم ده هيخليها تشرب ميه 💧✨", price: "210 ج.م" }
        ];

        const grid = document.getElementById('grid');
        grid.innerHTML = products.map(p => `
            <div class="card">
                <div class="img-box"></div>
                <div class="p-name">${p.name}</div>
                <div class="p-desc">${p.desc}</div>
                <div class="p-price">${p.price}</div>
                <button class="btn-action btn-add" onclick="sendWhatsApp('${p.name}')">أضف للسلة</button>
                <button class="btn-action btn-wish">المفضلة</button>
            </div>
        `).join('');

        function sendWhatsApp(productName) {
            window.open(`https://wa.me/${myPhoneNumber}?text=أريد طلب: ${productName}`);
        }
    </script>
</body>
</html>
