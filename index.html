<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كاريزما لمستحضرات التجميل - طنطا</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 15px; }
    
    /* الهيدر بتصميم نظيف يظهر اللوجو والعنوان بدقة */
    header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; text-align: center; }
    
    .store-logo-img {
      width: 90px; height: 90px; object-fit: cover;
      border-radius: 50%; border: 2px solid #ff2a74;
      box-shadow: 0 4px 15px rgba(255, 42, 116, 0.4); margin-bottom: 10px;
    }
    
    header h1 { color: #ff2a74; font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    
    .store-info {
      font-size: 12px; color: #aaa; line-height: 1.6; margin-bottom: 12px;
    }
    .store-info span { display: block; }

    .top-bar { display: flex; width: 100%; justify-content: space-between; align-items: center; border-top: 1px solid #222; padding-top: 12px; }
    
    .cart-btn-top {
      background: #ff2a74; color: #fff; border: none; padding: 8px 18px;
      border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px;
      box-shadow: 0 4px 15px rgba(255, 42, 116, 0.3); transition: 0.2s;
    }
    .cart-btn-top:active { transform: scale(0.95); }
    
    /* شريط البحث */
    .search-box {
      width: 100%; padding: 12px 20px; border-radius: 20px; border: 1px solid #333;
      background: #1e1e1e; color: #fff; margin-bottom: 15px; font-size: 14px; outline: none;
    }
    .search-box:focus { border-color: #ff2a74; }
    
    /* الفئات */
    .categories {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #252525; color: #ccc; border: 1px solid #333; padding: 8px 16px;
      border-radius: 20px; font-size: 14px; white-space: nowrap; cursor: pointer; transition: 0.2s;
    }
    .cat-btn.active { background: #ff2a74; color: #fff; border-color: #ff2a74; font-weight: bold; }

    /* شبكة المنتجات */
    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px;
    }
    .card {
      background-color: #1e1e1e; border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #2a2a2a;
      transition: 0.2s;
    }
    .card:hover { border-color: #ff2a7455; }
    .product-img {
      width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background-color: #252525;
    }
    .category-label { color: #ff2a74; font-size: 11px; font-weight: bold; margin-bottom: 4px; }
    .title { font-size: 13px; font-weight: bold; margin-bottom: 6px; line-height: 1.3; height: 36px; overflow: hidden; }
    .sku { font-size: 10px; color: #777; margin-bottom: 6px; }
    .price-tag { font-size: 13px; font-weight: bold; color: #25d366; margin-bottom: 10px; }
    
    /* أزرار الإضافة والتحكم بالكمية */
    .btn-add {
      background-color: #fff; color: #000; border: none; padding: 8px;
      border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 12px; width: 100%; transition: 0.2s;
    }
    .btn-add:active { background-color: #ff2a74; color: #fff; transform: scale(0.95); }
    
    .qty-box {
      display: flex; align-items: center; justify-content: space-between;
      background: #252525; border-radius: 20px; padding: 4px 8px; border: 1px solid #333;
    }
    .qty-btn {
      background: #ff2a74; color: #fff; border: none; width: 26px; height: 26px;
      border-radius: 50%; font-weight: bold; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-num { font-size: 14px; font-weight: bold; color: #fff; }

    /* نافذة السلة (Modal) */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 15px;
    }
    .modal-content {
      background: #1e1e1e; width: 100%; max-width: 400px; padding: 20px;
      border-radius: 15px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-content h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; color: #ff2a74; }
    #cart-items-list { max-height: 220px; overflow-y: auto; margin-bottom: 15px; font-size: 13px; color: #ccc; }
    .cart-item { margin-bottom: 10px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .cart-item-title { font-weight: bold; color: #fff; }
    .cart-item-sku { font-size: 10px; color: #888; }
    .cart-item-price { font-size: 12px; color: #25d366; font-weight: bold; }
    
    .total-box {
      display: flex; justify-content: space-between; align-items: center;
      background: #252525; padding: 10px 15px; border-radius: 10px; margin-bottom: 15px;
      font-size: 15px; font-weight: bold; border: 1px solid #333;
    }
    .total-amount { color: #25d366; font-size: 17px; }

    .btn-whatsapp { background: #25d366; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 14px; }
    .btn-close { background: #333; color: #ccc; border: none; width: 100%; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <!-- تأكد من تسمية صورة اللوجو باسم logo.jpg ووضعها في نفس مجلد الملف -->
    <img src="logo.jpg" alt="كاريزما لمستحضرات التجميل" class="store-logo-img" onerror="this.src='https://via.placeholder.com/90?text=Charisma'">
    
    <h1>كاريزما لمستحضرات التجميل</h1>
    
    <div class="store-info">
      <span>📍 طنطا - شارع طه الحكيم - أمام مستشفى الحميات</span>
      <span>📞 تليفون / واتساب: <a href="tel:01229044897" style="color:#ff2a74; text-decoration:none;">01229044897</a></span>
    </div>

    <div class="top-bar">
      <span style="font-size: 13px; color: #25d366; font-weight: bold;">✨ أهلاً بك، تسوق الآن</span>
      <button class="cart-btn-top" onclick="openCart()">🛒 السلة (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <input type="text" id="search" class="search-box" placeholder="🔍 ابحث عن منتج بالاسم أو الكود..." oninput="filterProducts()">
  <div class="categories" id="categories-list"></div>
  <div class="grid-container" id="products-list"></div>

  <!-- نافذة السلة -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
      <h2>🛒 مراجعة الطلب</h2>
      <div id="cart-items-list"></div>
      
      <div class="total-box">
        <span>الإجمالي:</span>
        <span class="total-amount" id="cart-total-price">0 ج.م</span>
      </div>

      <button class="btn-whatsapp" onclick="checkoutWhatsapp('201229044897')">📲 إرسال الطلب عبر واتساب</button>
      <button class="btn-close" onclick="closeCart()">إغلاق</button>
    </div>
  </div>

  <script>
    let allProducts = [];
    let selectedCat = 'الكل';
    let cart = JSON.parse(localStorage.getItem('charisma_cart')) || [];

    function getProfessionalCategory(name) {
      if (/(منظف|برسيل|اريل|تايد|تواليت|مريش|كلور|ديتول|جنرال|فلاش|داوني|فيري|وفير)/.test(name)) return 'منظفات';
      if (/(مناديل|بامبرز|توتو|بامبي|مولفيكس|فاين|وايبس|ورق|حفاضات)/.test(name)) return 'ورقيات';
      if (/(صابون|صابونة|لايفبوي|كاماي|لوكس|دوف)/.test(name)) return 'صابون';
      if (/(شامبو|بلسم|سيروم|استشوار|زيت|شعر|بليس|هير|شاور|باديكير|حمام كريم)/.test(name)) return 'هير كير';
      if (/(صن بلوك|غسول|كريم|لوشن|ماسك|بشرة|سكين|تفتيح|مرطب|بودرة للوجه|ايس كريم|جيل|بيبي|مزيل)/.test(name)) return 'سكين كير';
      if (/(عطر|سبلاش|برفان|مسك|بادي|معطر)/.test(name)) return 'بارفان سبلاش مزيلات';
      if (/(مكياج|روج|فاونديشن|بودرة|ماسكارا|شادو)/.test(name)) return 'مكياج';
      return 'اكسسوار واجهزة';
    }

    fetch('products.json')
      .then(res => res.json())
      .then(data => {
        processProducts(data);
      })
      .catch(err => {
        const sampleData = [
          { id: "101", name: "غسول وجه للبشرة الدهنية", price: 150, image: "", category: "سكين كير" },
          { id: "102", name: "شامبو للشعر الجاف", price: 95, image: "", category: "هير كير" },
          { id: "103", name: "برسيل جل للملابس", price: 120, image: "", category: "منظفات" }
        ];
        processProducts(sampleData);
      });

    function processProducts(data) {
      allProducts = data.map(p => ({
        ...p,
        price: p.price ? parseFloat(p.price) : 0,
        category: p.category || getProfessionalCategory(p.name)
      }));
      renderCategories();
      filterProducts();
      updateCartCountUI();
    }

    function renderCategories() {
      const cats = ['الكل', 'سكين كير', 'هير كير', 'منظفات', 'ورقيات', 'صابون', 'بارفان سبلاش مزيلات', 'مكياج', 'اكسسوار واجهزة'];
      const catContainer = document.getElementById('categories-list');
      catContainer.innerHTML = cats.map(c => `
        <button class="cat-btn ${c === selectedCat ? 'active' : ''}" onclick="selectCat(this, '${c}')">${c}</button>
      `).join('');
    }

    function selectCat(btn, cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCat = cat;
      filterProducts();
    }

    function filterProducts() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = allProducts.filter(p => {
        const matchesCat = selectedCat === 'الكل' || p.category === selectedCat;
        const matchesSearch = p.name.toLowerCase().includes(query) || p.id.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });
      renderProducts(filtered);
    }

    function renderProducts(products) {
      const container = document.getElementById('products-list');
      container.innerHTML = products.map(item => {
        const cartItem = cart.find(i => i.id === item.id);
        const qty = cartItem ? cartItem.qty : 0;

        let actionHtml = '';
        if (qty === 0) {
          actionHtml = `<button class="btn-add" onclick="changeQty('${item.id}', '${item.name}', ${item.price}, 1)">🛒 إضافة للسلة</button>`;
        } else {
          actionHtml = `
            <div class="qty-box">
              <button class="qty-btn" onclick="changeQty('${item.id}', '${item.name}', ${item.price}, -1)">-</button>
              <span class="qty-num">${qty}</span>
              <button class="qty-btn" onclick="changeQty('${item.id}', '${item.name}', ${item.price}, 1)">+</button>
            </div>
          `;
        }

        return `
          <div class="card">
            <div>
              ${item.image ? `<img src="${item.image}" alt="${item.name}" class="product-img">` : `<div class="product-img" style="display:flex;align-items:center;justify-content:center;color:#444;">📦</div>`}
              <div class="category-label">${item.category}</div>
              <div class="title">${item.name}</div>
              <div class="sku">كود: ${item.id}</div>
              <div class="price-tag">${item.price > 0 ? item.price + ' ج.م' : 'حسب الكمية'}</div>
            </div>
            <div>${actionHtml}</div>
          </div>
        `;
      }).join('');
    }

    function changeQty(id, name, price, delta) {
      let item = cart.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      } else if (delta > 0) {
        cart.push({ id, name, price, qty: 1 });
      }
      
      localStorage.setItem('charisma_cart', JSON.stringify(cart));
      updateCartCountUI();
      filterProducts();
    }

    function updateCartCountUI() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').innerText = totalCount;
    }

    function openCart() {
      const list = document.getElementById('cart-items-list');
      const totalPriceEl = document.getElementById('cart-total-price');
      
      if (cart.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#ff2a74; padding: 20px 0;">السلة فارغة حالياً</p>';
        totalPriceEl.innerText = '0 ج.م';
      } else {
        let total = 0;
        list.innerHTML = cart.map((item, index) => {
          let itemTotal = item.price * item.qty;
          total += itemTotal;
          return `
            <div class="cart-item">
              <div>
                <div class="cart-item-title">${index + 1}. ${item.name}</div>
                <div class="cart-item-sku">كود: ${item.id}</div>
                <div class="cart-item-price">${item.price > 0 ? itemTotal + ' ج.م (' + item.qty + ' × ' + item.price + ')' : ''}</div>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <button onclick="changeQty('${item.id}', '${item.name}', ${item.price}, -1); openCart();" style="background:#333; color:#fff; border:none; width:24px; height:24px; border-radius:4px; cursor:pointer;">-</button>
                <span style="font-weight:bold;">${item.qty}</span>
                <button onclick="changeQty('${item.id}', '${item.name}', ${item.price}, 1); openCart();" style="background:#333; color:#fff; border:none; width:24px; height:24px; border-radius:4px; cursor:pointer;">+</button>
              </div>
            </div>
          `;
        }).join('');
        totalPriceEl.innerText = total > 0 ? total + ' ج.م' : 'يتم تحديده عند التأكيد';
      }
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function closeCart() {
      document.getElementById('cart-modal').style.display = 'none';
    }

    function checkoutWhatsapp(phoneNumber) {
      if (cart.length === 0) {
        alert('السلة فارغة، أضف منتجات أولاً!');
        return;
      }
      let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      let message = "مرحباً كاريزما لمستحضرات التجميل، أريد طلب المنتجات التالية:%0a%0a";
      cart.forEach((item, index) => {
        message += `${index + 1}- ${item.name} (كود: ${item.id}) × ${item.qty} ${item.price > 0 ? '- ' + (item.price * item.qty) + ' ج.م' : ''}%0a`;
      });
      if (total > 0) {
        message += `%0a💰 الإجمالي: ${total} ج.م`;
      }
      message += "%0aبرجاء تأكيد الطلب والمواعيد.";
      window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
    }
  </script>
</body>
</html>
