<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charisma Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 15px; }
    h1 { text-align: center; margin-bottom: 20px; color: #ff2a74; font-size: 24px; }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      max-width: 1000px;
      margin: 0 auto;
    }
    
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #2a2a2a;
    }
    
    .category {
      color: #ff2a74;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    
    .title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    
    .btn {
      background-color: #fff;
      color: #000;
      border: none;
      padding: 8px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <h1>كاريزما ستور - Charisma Store</h1>
  <div class="grid-container" id="products-list"></div>

  <script>
    fetch('products.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('products-list');
        container.innerHTML = data.map(item => `
          <div class="card">
            <div>
              <div class="category">كود: ${item.id}</div>
              <div class="title">${item.name}</div>
            </div>
            <button class="btn">🛒 إضافة للسلة</button>
          </div>
        `).join('');
      })
      .catch(err => console.error('Error loading JSON:', err));
  </script>
</body>
</html>
