<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charisma Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; padding: 12px; padding-bottom: 80px; }
        
        /* Header Section */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-size: 22px; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 5px; }
        .logo span { color: #e91e63; }
        .cart-btn { background-color: #e91e63; color: white; padding: 8px 16px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
        
        /* Title and Search */
        .page-title { font-size: 24px; font-weight: bold; margin-bottom: 12px; }
        .page-title span { color: #e91e63; }
        .search-container { position: relative; margin-bottom: 15px; }
        .search-box { width: 100%; padding: 12px 15px; border-radius: 25px; border: 1px solid #2a2a2a; background-color: #161616; color: white; outline: none; font-size: 14px; }
        
        /* Categories Scroll */
        .categories { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .cat-card { background-color: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; min-width: 85px; padding: 10px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .cat-card.active { border-color: #e91e63; background-color: #1f1217; }
        .cat-icon { font-size: 22px; }
        .cat-title { font-size: 11px; font-weight: 600; color: #ccc; white-space: nowrap; }
        
        /* Product Grid & Cards */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card { background-color: #161616; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #222; }
        
        .img-container { position: relative; width: 100%; height: 180px; background-color: #222; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .badge-discount { position: absolute; top: 10px; right: 10px; background-color: #e91e63; color: white; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        
        .product-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
        .category-tag { font-size: 10px; color: #e91e63; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        .product-title { font-size: 13px; font-weight: bold; line-height: 1.3; color: #fff; margin-bottom: 4px; }
        .product-desc { font-size: 11px; color: #888; line-height: 1.3; margin-bottom: 8px; }
        
        .price-container { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
        .current-price { font-size: 16px; font-weight: 800; color: #fff; }
        .old-price { font-size: 12px; color: #666; text-decoration: line-through; }
        
        .add-to-cart { background-color: #ffffff; color: #000000; border: none; padding: 10px; border-radius: 12px; width: 100%; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Charisma <span>✨</span></div>
        <button class="cart-btn" onclick="sendWhatsApp()">🛒 Cart (<span id="cart-count">0</span>)</button>
    </header>

    <div class="page-title">All <span>Products</span></div>

    <div class="search-container">
        <input type="text" class="search-box" placeholder="🔍 Search products..." onkeyup="searchProducts(this.value)">
    </div>

    <!-- الأقسام -->
    <div class="categories">
        <div class="cat-card active" onclick="filterProducts('all', this)">
            <span class="cat-icon">🏠</span>
            <span class="cat-title">All</span>
        </div>
        <div class="cat-card" onclick="filterProducts('skin', this)">
            <span class="cat-icon">🌿</span>
            <span class="cat-title">Skin Care</span>
        </div>
        <div class="cat-card" onclick="filterProducts('hair', this)">
            <span class="cat-icon">💇‍♀️</span>
            <span class="cat-title">Hair Care</span>
        </div>
        <div class="cat-card" onclick="filterProducts('body', this)">
            <span class="cat-icon">🧴</span>
            <span class="cat-title">Body Care</span>
        </div>
    </div>

    <!-- شبكة المنتجات -->
    <div class="products-grid" id="products-container"></div>

    <script>
        const products = [
            { 
                id: 1, 
                title: "كريم إيدين Care & More 🌸✨", 
                category: "body", 
                tag: "BODY CARE",
                desc: "إيدك محتاجة ترطيب ونعومة طول اليوم؟ كريم ممتااااز جداً مغذي لليدين.",
                price: 48, 
                oldPrice: 70, 
                discount: "OFF 31%", 
                image: "https://dummyimage.com/300x300/1e1e1e/fff&text=Care+%26+More" 
            },
            { 
                id: 2, 
                title: "ماكينة براون Silk-épil 7 💜✨", 
                category: "hair", 
                tag: "HAIR REMOVAL",
                desc: "انسي الحلاقة اليومية واستمتعي ببشرة ناعمة من أول استخدام 😍",
                price: 6500, 
                oldPrice: 8000, 
                discount: "OFF 19%", 
                image: "https://dummyimage.com/300x300/1e1e1e/fff&text=Braun+Silk-epil" 
            },
            { 
                id: 3, 
                title: "Leaves Hair Mask 🌿", 
                category: "hair", 
                tag: "HAIR CARE",
                desc: "ماسك طبيعي لمعالجة هيشان الشعر وترطيبه من الجذور.",
                price: 250, 
                oldPrice: 300, 
                discount: "OFF 17%", 
                image: "https://dummyimage.com/300x300/1e1e1e/fff&text=Leaves+Mask" 
            },
            { 
                id: 4, 
                title: "Ruska Hair Serum ✨", 
                category: "skin", 
                tag: "SKIN CARE",
                desc: "سيروم مغذي ومصلح للبشرة وإعطائها نضارة فورية.",
                price: 170, 
                oldPrice: 220, 
                discount: "OFF 23%", 
                image: "https://dummyimage.com/300x300/1e1e1e/fff&text=Ruska+Serum" 
            }
        ];

        let cart = [];

        function displayProducts(items) {
            const container = document.getElementById('products-container');
            if (items.length === 0) {
                container.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #888; padding: 20px;">لا توجد منتجات</p>';
                return;
            }
            container.innerHTML = items.map(product => `
                <div class="product-card">
                    <div class="img-container">
                        <span class="badge-discount">${product.discount}</span>
                        <img src="${product.image}" alt="${product.title}" class="product-img">
                    </div>
                    <div class="product-info">
                        <span class="category-tag">${product.tag}</span>
                        <div class="product-title">${product.title}</div>
                        <div class="product-desc">${product.desc}</div>
                        <div class="price-container">
                            <span class="current-price">${product.price} EGP</span>
                            <span class="old-price">${product.oldPrice} EGP</span>
                        </div>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">🛒 Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts(category, btn) {
            document.querySelectorAll('.cat-card').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (category === 'all') {
                displayProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                displayProducts(filtered);
            }
        }

        function searchProducts(query) {
            const filtered = products.filter(p => p.title.toLowerCase().includes(query.toLowerCase()));
            displayProducts(filtered);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            document.getElementById('cart-count').innerText = cart.length;
        }

        function sendWhatsApp() {
            if (cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }
            let text = "مرحباً كاريزما، أريد طلب المنتجات التالية:\n";
            cart.forEach((item, index) => {
                text += `${index + 1}. ${item.title} - ${item.price} EGP\n`;
            });
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        displayProducts(products);
    </script>
</body>
</html>
