٣<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charisma Store - متجر كاريزما</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 15px; }
        
        /* الهيدر وزر السلة */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-size: 24px; font-weight: 900; color: #e91e63; }
        .cart-btn-header { background: #e91e63; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; }

        /* مربع البحث */
        .search-input { width: 100%; padding: 14px; border-radius: 15px; border: none; background: #1e1e1e; color: #fff; font-size: 16px; margin-bottom: 15px; outline: none; border: 1px solid #333; }
        
        /* الفئات - Scroll أفقياً */
        .categories-container { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .categories-container::-webkit-scrollbar { display: none; }
        .cat-item { white-space: nowrap; background: #1e1e1e; padding: 10px 18px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; border: 1px solid #333; }
        .cat-item.active { border-color: #e91e63; background: #e91e63; color: #fff; }

        /* شبكة المنتجات */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #282828; }
        
        /* الصور */
        .img-box { width: 100%; height: 140px; border-radius: 10px; margin-bottom: 10px; object-fit: cover; background: #252525; }
        
        /* الخطوط والنصوص */
        .p-name { font-size: 16px; font-weight: bold; margin-bottom: 6px; color: #ffffff; line-height: 1.3; }
        .p-desc { font-size: 13px; color: #b0b0b0; margin-bottom: 10px; line-height: 1.4; }
        .p-price { font-weight: 900; color: #e91e63; font-size: 18px; margin-bottom: 10px; }
        
        /* الأزرار */
        .btn-add { width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: #fff; color: #000; font-size: 14px; }
        .btn-wish { width: 100%; padding: 8px; border-radius: 8px; border: none; background: #2a2a2a; color: #fff; margin-top: 6px; cursor: pointer; font-size: 13px; }

        /* نافذة السلة (Modal) */
        .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .cart-content { background: #1e1e1e; width: 90%; max-width: 400px; padding: 20px; border-radius: 15px; border: 1px solid #333; max-height: 80vh; overflow-y: auto; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #282828; padding: 10px; border-radius: 8px; }
        .close-btn { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .checkout-btn { width: 100%; background: #25d366; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; }
        .delete-btn { background: #e91e63; color: white; border: none; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Charisma Store ✨</div>
        <button class="cart-btn-header" onclick="toggleCartModal()">🛒 السلة (<span id="cart-count">0</span>)</button>
    </header>
    
    <input type="text" class="search-input" id="search" placeholder="ابحث عن المنتجات..." onkeyup="filterProducts()">

    <!-- كل الفئات كاملة -->
    <div class="categories-container" id="cats">
        <div class="cat-item active" onclick="filterCat('الكل', this)">الكل</div>
        <div class="cat-item" onclick="filterCat('العناية بالبشرة', this)">العناية بالبشرة</div>
        <div class="cat-item" onclick="filterCat('العناية بالشعر', this)">العناية بالشعر</div>
        <div class="cat-item" onclick="filterCat('العناية بالجسم', this)">العناية بالجسم</div>
        <div class="cat-item" onclick="filterCat('الأجهزة', this)">الأجهزة</div>
        <div class="cat-item" onclick="filterCat('المكياج', this)">المكياج</div>
        <div class="cat-item" onclick="filterCat('العطور', this)">العطور</div>
        <div class="cat-item" onclick="filterCat('الإكسسوارات', this)">الإكسسوارات</div>
    </div>

    <div class="product-grid" id="grid"></div>

    <!-- نافذة السلة -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h3>سلة المشتريات 🛒</h3>
                <button class="close-btn" onclick="toggleCartModal()">✕</button>
            </div>
            <div id="cart-items-list">
                <!-- المنتجات في السلة بتظهر هنا -->
            </div>
            <div style="margin-top: 15px; text-align: left; font-weight: bold;" id="cart-total"></div>
            <button class="checkout-btn" onclick="sendWhatsAppOrder()">إتمام الطلب عبر الواتساب 💬</button>
        </div>
    </div>

    <script>
        const myPhoneNumber = "201229044897";
        let cart = [];

        const products = [
            { 
                id: 1, 
                name: "Derma Ten Vitamin C Serum", 
                cat: "العناية بالبشرة", 
                desc: "سيرم فيتامين سي للنضارة وتفتيح التصبغات وآثار الحبوب ✨🍊", 
                price: 210,
                img: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=400"
            },
            { 
                id: 2, 
                name: "Derma Ten Hyaluronic Acid", 
                cat: "العناية بالبشرة", 
                desc: "سيرم الهيالورونيك لترطيب عميق وحماية من الجفاف 💧✨", 
                price: 210,
                img: "https://images.unsplash.com/photo-1608248597260-50d268d83d16?w=400"
            },
            { 
                id: 3, 
                name: "شامبو معالج للشعر", 
                cat: "العناية بالشعر", 
                desc: "لتغذية وإصلاح الشعر التالف وإعادة اللمعان ✨", 
                price: 180,
                img: "https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?w=400"
            },
            { 
                id: 4, 
                name: "جهاز براون سيلك ابيل", 
                cat: "الأجهزة", 
                desc: "جهاز العناية المتكامل والمريح للإزالة السريعة", 
                price: 6500,
                img: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=400"
            },
                    { 
                id: 5, 
                name: "انفينتى لوشن صن بلوك عرض ٢ قطعة", 
                cat: "العناية بالبشرة", 
                desc: "💥 صن بلوك انفينتى لوشن ⭐واقي شمس انفينيتي جل للبشره العاديه والجافه ⭐ملمس ممتاز زى الجل خفيف جدا ⭐عامل حمايه ٥٠ ⭐يحمى من اشعه الشمس uva uvb افضل صن بلوك بسعر اقتصادي جدا متوفر عرض شركه انفينيتي استفيدي بالعرض انتي وصحبتك الاتنين مع بعض او قطعة واحدة عادي 🔥😍😍", 
                price: 170,
                img: "FB_IMG_1786710729539.jpg"
            },
];


        function render(items) {
            const grid = document.getElementById('grid');
            grid.innerHTML = items.map(p => `
                <div class="card">
                    <img src="${p.img}" class="img-box" alt="${p.name}">
                    <div>
                        <div class="p-name">${p.name}</div>
                        <div class="p-desc">${p.desc}</div>
                    </div>
                    <div>
                        <div class="p-price">${p.price} ج.م</div>
                        <button class="btn-add" onclick="addToCart(${p.id})">أضف للسلة 🛒</button>
                        <button class="btn-wish">المفضلة ♥</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const cartList = document.getElementById('cart-items-list');
            const totalBox = document.getElementById('cart-total');

            if (cart.length === 0) {
                cartList.innerHTML = "<p style='text-align:center; color:#888;'>السلة فارغة حالياً</p>";
                totalBox.innerText = "";
                return;
            }

            let total = 0;
            cartList.innerHTML = cart.map((p, index) => {
                total += p.price;
                return `
                    <div class="cart-item">
                        <div>
                            <div><strong>${p.name}</strong></div>
                            <div style="color:#e91e63; font-size:13px;">${p.price} ج.م</div>
                        </div>
                        <button class="delete-btn" onclick="removeFromCart(${index})">حذف</button>
                    </div>
                `;
            }).join('');

            totalBox.innerText = "الإجمالي: " + total + " ج.م";
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }
            let itemsText = cart.map((p, index) => `${index + 1}- ${p.name} (${p.price} ج.م)`).join('%0A');
            let total = cart.reduce((sum, p) => sum + p.price, 0);
            let message = `مرحباً، أريد طلب المنتجات التالية:%0A${itemsText}%0A%0Aالإجمالي: ${total} ج.م`;

            window.open(`https://wa.me/${myPhoneNumber}?text=${message}`);
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            const filtered = cat === 'الكل' ? products : products.filter(p => p.cat === cat);
            render(filtered);
        }

        function filterProducts() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.desc.includes(query));
            render(filtered);
        }

        render(products);
    </script>
</body>
</html>
