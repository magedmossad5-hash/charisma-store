<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charisma Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; padding: 14px; padding-bottom: 90px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .logo { font-size: 26px; font-weight: 900; color: #ffffff; }
        .logo span { color: #e91e63; }
        .cart-btn { background-color: #e91e63; color: white; padding: 10px 18px; border-radius: 25px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }

        .page-title { font-size: 28px; font-weight: 800; margin-bottom: 14px; }
        .page-title span { color: #e91e63; }
        .search-container { position: relative; margin-bottom: 18px; }
        .search-box { width: 100%; padding: 14px 18px; border-radius: 30px; border: 1px solid #333; background-color: #1a1a1a; color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .product-card { background-color: #161616; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
        
        .img-container { position: relative; width: 100%; height: 210px; background-color: #222; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .badge-discount { position: absolute; top: 10px; right: 10px; background-color: #e91e63; color: white; padding: 4px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }

        .product-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .category-tag { font-size: 14px; color: #e91e63; text-transform: uppercase; font-weight: 800; }
        .product-title { font-size: 20px; font-weight: 800; line-height: 1.3; color: #fff; margin-bottom: 6px; }
        .product-desc { font-size: 18px; color: #aaa; line-height: 1.4; margin-bottom: 10px; }
        
        .price-container { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
        .current-price { font-size: 20px; font-weight: 900; color: #fff; }
        .old-price { font-size: 14px; color: #777; text-decoration: line-through; }

        .add-to-cart { background-color: #ffffff; color: #000000; border: none; padding: 12px; border-radius: 14px; font-size: 16px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Charisma<span>✨</span></div>
        <button class="cart-btn" onclick="sendWhatsApp()">السلة (<span id="cart-count">0</span>)</button>
    </header>

    <div class="page-title">All <span>Products</span></div>

    <div class="products-grid" id="product-grid">
        <!-- المنتجات هتظهر هنا -->
    </div>

    <script>
        // تم تحديث الرقم لرقمك الخاص
        const myPhoneNumber = "201229044897"; 

        const products = [
            { id: 1, title: "غسول ستارفيل", category: "skin", tag: "SKIN CARE", desc: "غسول ممتاز للبشرة الدهنية.", price: 150, oldPrice: 200, discount: "OFF 25%", image: "FB_IMG_1786693730612.jpg" },
            { id: 2, title: "ماكينة براون", category: "hair", tag: "HAIR REMOVAL", desc: "بشرة ناعمة.", price: 6500, oldPrice: 8000, discount: "OFF 19%", image: "FB_IMG_1786693730612.jpg" }
        ];

        let cart = [];

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            document.getElementById('cart-count').innerText = cart.length;
            alert(product.title + " أضيفت للسلة!");
        }

        function sendWhatsApp() {
            if (cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }
            let message = "مرحباً، أريد طلب المنتجات التالية:\n";
            cart.forEach((p, index) => {
                message += `${index + 1}- ${p.title} (${p.price} EGP)\n`;
            });
            const url = `https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        const grid = document.getElementById('product-grid');
        grid.innerHTML = products.map(p => `
            <div class="product-card">
                <div class="img-container">
                    <img src="${p.image}" class="product-img">
                    <div class="badge-discount">${p.discount}</div>
                </div>
                <div class="product-info">
                    <div class="category-tag">${p.tag}</div>
                    <div class="product-title">${p.title}</div>
                    <div class="product-desc">${p.desc}</div>
                    <div class="price-container">
                        <span class="current-price">EGP ${p.price}</span>
                        <span class="old-price">EGP ${p.oldPrice}</span>
                    </div>
                    <button class="add-to-cart" onclick="addToCart(${p.id})">إضافة للسلة</button>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
