<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charisma Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; padding: 15px; transition: 0.3s; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: 900; }
        .logo span { color: #e91e63; }
        
        .lang-btn { background: #333; color: white; border: none; padding: 6px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; }
        .cart-btn { background-color: #e91e63; color: white; padding: 6px 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }

        .page-title { font-size: 28px; font-weight: 800; margin-bottom: 15px; }
        .search-box { width: 100%; padding: 12px; border-radius: 20px; border: none; background-color: #1a1a1a; color: #fff; margin-bottom: 20px; }

        .categories-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .cat-card { min-width: 90px; background-color: #1a1a1a; border: 2px solid #333; border-radius: 15px; padding: 10px; text-align: center; cursor: pointer; }
        .cat-name { font-size: 12px; font-weight: bold; margin-top: 5px; }

        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .product-card { background-color: #161616; border-radius: 20px; padding: 10px; overflow: hidden; }
        .product-img { width: 100%; height: 150px; object-fit: cover; border-radius: 15px; }
        .product-title { font-size: 16px; font-weight: bold; margin: 10px 0; }
        .price { color: #e91e63; font-weight: bold; margin-bottom: 10px; }
        .add-btn { width: 100%; background: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Charisma<span>✨</span></div>
        <div>
            <button class="lang-btn" onclick="toggleLang()">العربية / EN</button>
            <button class="cart-btn" onclick="sendWhatsApp()" data-i18n="cart">Cart (0)</button>
        </div>
    </header>

    <h1 class="page-title" data-i18n="all_products">All Products</h1>
    <input type="text" class="search-box" data-i18n="search" placeholder="Search...">

    <div class="categories-container">
        <div class="cat-card"><div class="cat-name" data-i18n="all">All</div></div>
        <div class="cat-card"><div class="cat-name" data-i18n="skin">Skin Care</div></div>
        <div class="cat-card"><div class="cat-name" data-i18n="hair">Hair Care</div></div>
    </div>

    <div class="products-grid" id="grid">
        <!-- المنتجات هتظهر هنا -->
    </div>

    <script>
        const myPhoneNumber = "201229044897"; 
        let cart = [];
        let currentLang = 'en';

        const translations = {
            en: { all_products: "All Products", cart: "Cart", search: "Search...", all: "All", skin: "Skin Care", hair: "Hair Care", add: "Add to Cart" },
            ar: { all_products: "كل المنتجات", cart: "السلة", search: "بحث...", all: "الكل", skin: "بشرة", hair: "شعر", add: "أضف للسلة" }
        };

        const products = [
            { id: 1, title: "Starville Wash", price: 150 },
            { id: 2, title: "Braun Silk", price: 6500 }
        ];

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) el.innerText = translations[currentLang][key];
            });
            document.querySelector('[data-i18n="search"]').placeholder = translations[currentLang]['search'];
            updateButtons();
        }

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            document.querySelector('[data-i18n="cart"]').innerText = translations[currentLang]['cart'] + " (" + cart.length + ")";
            alert("Added!");
        }

        function updateButtons() {
            document.querySelectorAll('.add-btn').forEach((btn, index) => {
                btn.innerText = translations[currentLang]['add'];
            });
        }

        function sendWhatsApp() {
            if(cart.length === 0) return alert("Empty!");
            let msg = "Order: " + cart.map(p => p.title).join(", ");
            window.open(`https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(msg)}`);
        }

        const grid = document.getElementById('grid');
        grid.innerHTML = products.map(p => `
            <div class="product-card">
                <div class="product-img" style="background:#333"></div>
                <div class="product-title">${p.title}</div>
                <div class="price">EGP ${p.price}</div>
                <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
        `).join('');
    </script>
</body>
</html>
