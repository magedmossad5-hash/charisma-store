<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charisma Store - كاريزما ستور</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 15px; padding-bottom: 90px; }
    
    header { text-align: center; margin-bottom: 15px; }
    header h1 { color: #ff2a74; font-size: 22px; margin-bottom: 10px; }
    
    .search-box {
      width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid #333;
      background: #1e1e1e; color: #fff; margin-bottom: 15px; font-size: 14px; outline: none;
    }
    
    .categories {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #252525; color: #ccc; border: 1px solid #333; padding: 6px 14px;
      border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer;
    }
    .cat-btn.active { background: #ff2a74; color: #fff; border-color: #ff2a74; font-weight: bold; }

    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
    }
    
    .card {
      background-color: #1e1e1e; border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; justify-content: space-between;
      border: 1px solid #2a2a2a;
    }
    
    .category-label { color: #ff2a74; font-size: 11px; font-weight: bold; margin-bottom: 4px; }
    .title { font-size: 13px; font-weight: bold; margin-bottom: 8px; line-height: 1.3; height: 36px; overflow: hidden; }
    .sku { font-size: 10px; color: #777; margin-bottom: 10px; }
    
    .btn-add {
      background-color: #fff; color: #000; border: none; padding: 8px;
      border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 12px; width: 100%;
    }
    .btn-add:active { background-color: #ff2a74; color: #fff; }

    .cart-float {
      position: fixed; bottom: 15px; left: 15px; right: 15px;
      background: #ff2a74; color: #fff; padding: 12px 20px; border-radius: 30px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 8px 20px rgba(255, 42, 116, 0.4); font-weight: bold; font-size: 14px;
      cursor: pointer; z-index: 1000;
    }
  </style>
</head>
<body>

  <header>
    <h1>كاريزما ستور - Charisma Store</h1>
  </header>

  <input type="text" id="search" class="search-box" placeholder="🔍 ابحث عن منتج..." oninput="filterProducts()">

  <div class="categories" id="categories-list"></div>

  <div class="grid-container" id="products-list"></div>

  <div class="cart-float" onclick="openCart()">
    <div>🛒 السلة (<span id="cart-count">0</span>)</div>
    <div>إتمام الطلب ➔</div>
  </div>

  <script>
    let allProducts = [];
    let selectedCat = 'الكل';
    let cart = [];

    // قوائم الكلمات الدلالية لإنشاء تصنيف تلقائي
    const autoCategories = ['صن بلوك', 'غسول', 'كريم', 'بلسم', 'شامبو', 'سيروم', 'صابون', 'لوشن', 'عطر', 'زيت'];

    fetch('products.json')
      .then(res => res.json())
      .then(data => {
        allProducts = data.map(p => {
          // استخراج القسم تلقائياً لو مش موجود
          let cat = p.category || 'أخرى';
          if (!p.category) {
            for (let keyword of autoCategories) {
              if (p.name.includes(keyword)) { cat = keyword; break; }
            }
          }
          return { ...p, category: cat };
        });
        
        renderCategories();
        filterProducts();
      });

    function renderCategories() {
      const cats = ['الكل', ...new Set(allProducts.map(p => p.category))];
      const catContainer = document.getElementById('categories-list');
      catContainer.innerHTML = cats.map(c => `
        <button class="cat-btn ${c === 'الكل' ? 'active' : ''}" onclick="selectCat(this, '${c}')">${c}</button>
      `).join('');
    }

    function selectCat(btn, cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCat = cat;
      filterProducts();
    }

    function filterProducts() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = allProducts.filter(p => {
        const matchesCat = selectedCat === 'الكل' || p.category === selectedCat;
        const matchesSearch = p.name.toLowerCase().includes(query) || p.id.includes(query);
        return matchesCat && matchesSearch;
      });
      renderProducts(filtered);
    }

    function renderProducts(products) {
      const container = document.getElementById('products-list');
      container.innerHTML = products.map(item => `
        <div class="card">
          <div>
            <div class="category-label">${item.category}</div>
            <div class="title">${item.name}</div>
            <div class="sku">كود: ${item.id}</div>
          </div>
          <button class="btn-add" onclick="addToCart('${item.id}')">🛒 إضافة للسلة</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      cart.push(id);
      document.getElementById('cart-count').innerText = cart.length;
    }

    function openCart() {
      alert(cart.length > 0 ? `في السلة ${cart.length} منتج.` : "السلة فارغة!");
    }
  </script>
</body>
</html>
