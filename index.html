<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charisma Store - كاريزما ستور</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 15px; }
    
    /* الهيدر والسلة العلوية */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    header h1 { color: #ff2a74; font-size: 20px; font-weight: bold; }
    .cart-btn-top {
      background: #ff2a74; color: #fff; border: none; padding: 8px 16px;
      border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px;
      box-shadow: 0 4px 14px rgba(255, 42, 116, 0.3); transition: 0.2s;
    }
    .cart-btn-top:active { transform: scale(0.95); }
    
    /* شريط البحث */
    .search-box {
      width: 100%; padding: 12px 20px; border-radius: 20px; border: 1px solid #333;
      background: #1e1e1e; color: #fff; margin-bottom: 15px; font-size: 14px; outline: none;
    }
    .search-box:focus { border-color: #ff2a74; }
    
    /* الفئات */
    .categories {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #252525; color: #ccc; border: 1px solid #333; padding: 8px 16px;
      border-radius: 20px; font-size: 14px; white-space: nowrap; cursor: pointer; transition: 0.2s;
    }
    .cat-btn.active { background: #ff2a74; color: #fff; border-color: #ff2a74; font-weight: bold; }

    /* شبكة المنتجات */
    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
    }
    .card {
      background-color: #1e1e1e; border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #2a2a2a;
    }
    .category-label { color: #ff2a74; font-size: 11px; font-weight: bold; margin-bottom: 4px; }
    .title { font-size: 13px; font-weight: bold; margin-bottom: 6px; line-height: 1.3; height: 36px; overflow: hidden; }
    .sku { font-size: 10px; color: #777; margin-bottom: 6px; }
    .price-tag { font-size: 13px; font-weight: bold; color: #25d366; margin-bottom: 10px; }
    
    .btn-add {
      background-color: #fff; color: #000; border: none; padding: 8px;
      border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 12px; width: 100%; transition: 0.2s;
    }
    .btn-add:active { background-color: #ff2a74; color: #fff; transform: scale(0.95); }

    /* نافذة السلة (Modal) */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 15px;
    }
    .modal-content {
      background: #1e1e1e; width: 100%; max-width: 400px; padding: 20px;
      border-radius: 15px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-content h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; color: #ff2a74; }
    #cart-items-list { max-height: 220px; overflow-y: auto; margin-bottom: 15px; font-size: 13px; color: #ccc; }
    .cart-item { margin-bottom: 10px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .cart-item-title { font-weight: bold; color: #fff; }
    .cart-item-sku { font-size: 10px; color: #888; }
    .cart-item-price { font-size: 12px; color: #25d366; font-weight: bold; }
    .btn-remove { background: none; border: none; color: #ff4d4d; font-size: 14px; cursor: pointer; padding: 2px 6px; }
    
    .total-box {
      display: flex; justify-content: space-between; align-items: center;
      background: #252525; padding: 10px 15px; border-radius: 10px; margin-bottom: 15px;
      font-size: 15px; font-weight: bold; border: 1px solid #333;
    }
    .total-amount { color: #25d366; font-size: 17px; }

    .btn-whatsapp { background: #25d366; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 14px; }
    .btn-close { background: #333; color: #ccc; border: none; width: 100%; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1>كاريزما ستور</h1>
    <button class="cart-btn-top" onclick="openCart()">🛒 السلة (<span id="cart-count">0</span>)</button>
  </header>

  <input type="text" id="search" class="search-box" placeholder="🔍 ابحث عن منتج بالاسم أو الكود..." oninput="filterProducts()">
  <div class="categories" id="categories-list"></div>
  <div class="grid-container" id="products-list"></div>

  <!-- نافذة السلة -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
      <h2>🛒 مراجعة الطلب</h2>
      <div id="cart-items-list"></div>
      
      <div class="total-box">
        <span>الإجمالي:</span>
        <span class="total-amount" id="cart-total-price">0 ج.م</span>
      </div>

      <button class="btn-whatsapp" onclick="checkoutWhatsapp('201229044897')">📲 إرسال الطلب عبر واتساب</button>
      <button class="btn-close" onclick="closeCart()">إغلاق</button>
    </div>
  </div>

  <script>
    let allProducts = [];
    let selectedCat = 'الكل';
    let cart = [];

    // نظام تصنيف شامل ومحدد
    function getProfessionalCategory(name) {
      if (/(منظف|برسيل|اريل|تايد|تواليت|مريش|كلور|ديتول|جنرال|فلاش|داوني|فيري|وفير)/.test(name)) return 'منظفات';
      if (/(مناديل|بامبرز|توتو|بامبي|مولفيكس|فاين|وايبس|بامبرز|ورق|حفاضات)/.test(name)) return 'ورقيات';
      if (/(صابون|صابونة|لايفبوي|كاماي|لوكس|دوف)/.test(name)) return 'صابون';
      if (/(شامبو|بلسم|سيروم|استشوار|زيت|شعر|بليس|هير|شاور|باديكير|حمام كريم)/.test(name)) return 'هير كير';
      if (/(صن بلوك|غسول|كريم|لوشن|ماسك|بشرة|سكين|تفتيح|مرطب|بودرة للوجه|ايس كريم|جيل|بيبي|مزيل)/.test(name)) return 'سكين كير';
      if (/(عطر|سبلاش|برفان|مسك|بادي|معطر)/.test(name)) return 'عطور ومعطرات';
      if (/(مكياج|روج|فاونديشن|بودرة|ماسكارا|شادو)/.test(name)) return 'ميك أب';
      return 'متنوعات';
    }

    fetch('products.json')
      .then(res => res.json())
      .then(data => {
        allProducts = data.map(p => ({
          ...p,
          price: p.price ? parseFloat(p.price) : 0, // أخذ السعر أو وضعه 0 إن لم يوجد
          category: p.category || getProfessionalCategory(p.name)
        }));
        renderCategories();
        filterProducts();
      });

    function renderCategories() {
      const cats = ['الكل', 'سكين كير', 'هير كير', 'منظفات', 'ورقيات', 'صابون', 'عطور ومعطرات', 'ميك أب', 'متنوعات'];
      const catContainer = document.getElementById('categories-list');
      catContainer.innerHTML = cats.map(c => `
        <button class="cat-btn ${c === 'الكل' ? 'active' : ''}" onclick="selectCat(this, '${c}')">${c}</button>
      `).join('');
    }

    function selectCat(btn, cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCat = cat;
      filterProducts();
    }

    function filterProducts() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = allProducts.filter(p => {
        const matchesCat = selectedCat === 'الكل' || p.category === selectedCat;
        const matchesSearch = p.name.toLowerCase().includes(query) || p.id.includes(query);
        return matchesCat && matchesSearch;
      });
      renderProducts(filtered);
    }

    function renderProducts(products) {
      const container = document.getElementById('products-list');
      container.innerHTML = products.map(item => `
        <div class="card">
          <div>
            <div class="category-label">${item.category}</div>
            <div class="title">${item.name}</div>
            <div class="sku">كود: ${item.id}</div>
            <div class="price-tag">${item.price > 0 ? item.price + ' ج.م' : 'حسب الكمية'}</div>
          </div>
          <button class="btn-add" onclick="addToCart('${item.id}', '${item.name}', ${item.price})">🛒 إضافة للسلة</button>
        </div>
      `).join('');
    }

    function addToCart(id, name, price) {
      cart.push({ id, name, price });
      document.getElementById('cart-count').innerText = cart.length;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      document.getElementById('cart-count').innerText = cart.length;
      openCart();
    }

    function openCart() {
      const list = document.getElementById('cart-items-list');
      const totalPriceEl = document.getElementById('cart-total-price');
      
      if (cart.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#ff2a74; padding: 20px 0;">السلة فارغة حالياً</p>';
        totalPriceEl.innerText = '0 ج.م';
      } else {
        let total = 0;
        list.innerHTML = cart.map((item, index) => {
          total += item.price;
          return `
            <div class="cart-item">
              <div>
                <div class="cart-item-title">${index + 1}. ${item.name}</div>
                <div class="cart-item-sku">كود: ${item.id}</div>
                <div class="cart-item-price">${item.price > 0 ? item.price + ' ج.م' : ''}</div>
              </div>
              <button class="btn-remove" onclick="removeFromCart(${index})">❌</button>
            </div>
          `;
        }).join('');
        totalPriceEl.innerText = total > 0 ? total + ' ج.م' : 'يتم تحديده عند التأكيد';
      }
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function closeCart() {
      document.getElementById('cart-modal').style.display = 'none';
    }

    function checkoutWhatsapp(phoneNumber) {
      if (cart.length === 0) {
        alert('السلة فارغة، أضف منتجات أولاً!');
        return;
      }
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      let message = "مرحباً كاريزما ستور، أريد طلب المنتجات التالية:%0a%0a";
      cart.forEach((item, index) => {
        message += `${index + 1}- ${item.name} (كود: ${item.id}) ${item.price > 0 ? '- ' + item.price + ' ج.م' : ''}%0a`;
      });
      if (total > 0) {
        message += `%0a💰 الإجمالي: ${total} ج.م`;
      }
      message += "%0aبرجاء تأكيد الطلب والمواعيد.";
      window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
    }
  </script>
</body>
</html>
